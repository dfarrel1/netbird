syntax = "proto3";

import "google/protobuf/descriptor.proto";

option go_package = "/proto";

package signalexchange;

service SignalExchange {
  // Synchronously connect to the Signal Exchange service offering connection candidates and waiting for connection candidates from the other party (remote peer)
  rpc Send(EncryptedMessage) returns (EncryptedMessage) {}
  // Connect to the Signal Exchange service offering connection candidates and maintain a channel for receiving candidates from the other party (remote peer)
  rpc ConnectStream(stream EncryptedMessage) returns (stream EncryptedMessage) {}
}

// Used for sending through signal.
// The body of this message is the Body message encrypted with the Wireguard private key and the remote Peer key
message EncryptedMessage {

  // Wireguard public key
  string key = 2;

  // Wireguard public key of the remote peer to connect to
  string remoteKey = 3;

  // encrypted message Body
  bytes body = 4;
}

// A decrypted representation of the EncryptedMessage. Used locally before/after encryption
message Message {
  // WireGuard public key
  string key = 2;

  // WireGuard public key of the remote peer to connect to
  string remoteKey = 3;

  Body body = 4;
}

// Actual body of the message that can contain credentials (type OFFER/ANSWER) or connection Candidate
// This part will be encrypted
message Body {
  // Message type
  enum Type {
    OFFER = 0;
    ANSWER = 1;
    CANDIDATE = 2;
    MODE = 4;
    GO_IDLE = 5;
    // ROSENPASS_KEY_REQUEST asks a peer for the full Rosenpass static public
    // key matching a digest we received but do not hold. Sent only when the
    // remote advertised ROSENPASS_KEY_BY_DIGEST. See F-338.
    ROSENPASS_KEY_REQUEST = 6;
    // ROSENPASS_KEY carries the full key in reply to a ROSENPASS_KEY_REQUEST.
    // This is the ONLY message type that may carry the 512 KiB key once both
    // peers support digest mode.
    ROSENPASS_KEY = 7;
  }
  Type type = 1;
  string payload = 2;
  // wgListenPort is an actual WireGuard listen port
  uint32 wgListenPort = 3;
  string netBirdVersion = 4;
  Mode mode = 5;

  // featuresSupported list of supported features by the client of this protocol
  repeated uint32 featuresSupported = 6;

  // RosenpassConfig is a Rosenpass config of the remote peer our peer tries to connect to
  RosenpassConfig rosenpassConfig = 7;

  // relayServerAddress is url of the relay server
  string relayServerAddress = 8;

  optional bytes sessionId = 10;
}

// Mode indicates a connection mode
message Mode {
  optional bool direct = 1;
}

message RosenpassConfig {
  // rosenpassPubKey is the FULL Classic McEliece 460896 static public key —
  // 524,160 bytes. Historically sent on every OFFER and ANSWER, which made a
  // routine offer ~512 KiB and swamped the signal plane (F-338: 99.3% of signal
  // bytes on a live deployment, and peers losing two thirds of their
  // connections to their own uplink).
  //
  // A peer that advertises ROSENPASS_KEY_BY_DIGEST in featuresSupported sends
  // rosenpassPubKeyDigest instead, and only ever puts the full key here in a
  // ROSENPASS_KEY reply to an explicit ROSENPASS_KEY_REQUEST.
  bytes rosenpassPubKey = 1;
  // rosenpassServerAddr is an IP:port of the rosenpass service
  string rosenpassServerAddr = 2;
  // rosenpassPubKeyDigest is BLAKE2s-256 of rosenpassPubKey — 32 bytes instead
  // of 524,160. The receiver resolves it from its own cache and asks for the
  // full key only on a miss, which happens about once per peer-pair per
  // key-lifetime because the key is generated once per process.
  bytes rosenpassPubKeyDigest = 3;
}
